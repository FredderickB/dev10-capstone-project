spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

logging:
  level:
    org.springframework.security: DEBUG